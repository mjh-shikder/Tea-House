<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tea House</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
      integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Google Font CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="container lg:mx-auto md:mx-auto mx-3">
    <!-- Banner -->
    <header
      id="banner-container"
      class="flex flex-col md:flex-row justify-between items-center max-w-[1250px] mx-auto "
    >
      <div id="banner-title" class="">
        <h1 class="text-[80px] font-bold">
          It's good <br />
          tea time at The <br />
          Tea House
        </h1>
        <p class="text-[18px] my-10 text-gray-500">
          Tea and Botanical Solutions Supplier Give Optimum <br />
          Satisfaction To Your Taste Buds.
        </p>
        <button
          class="w-[200px] h-[64px] text-white rounded-xl bg-gradient-to-r from-[#FF8938] to-[#FF0000]"
        >
          Explore More <i class="fa-solid fa-arrow-right -rotate-45"></i>
        </button>
      </div>
      <div id="banner-image" class="relative">
        <img
          class="relative top-[120px]"
          src="./images/banner.png"
          alt="Banner image"
        />
        <div
          class="bg-white w-[255px] h-[100px] flex items-center justify-center rounded-lg shadow-lg absolute right-20 left-[100px]"
        >
          <span class="text-4xl text-amber-400"
            ><i class="fa-solid fa-star"></i
          ></span>
          <div class="ml-4">
            <p class="text-4xl font-bold">5.00</p>
            <p class="text-gray-500">Trust Pilot Ratings</p>
          </div>
        </div>
      </div>
    </header>
  </body>
</html>
